name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Create DB & Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Branch Database Name
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr -cd '[:alnum:]_')
          echo "DB_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Pull Vercel Environment Variables
        run: npx vercel@latest pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Provision Branch Database & Run Migrations
        run: |
          # Load variables
          export $(grep -v '^#' .vercel/.env.preview.local | xargs)

          # Strip the trailing "/postgres" from the base URLs
          BASE_DATABASE_URL=$(echo "$DATABASE_URL" | sed 's/\/[^/]*$//')
          BASE_DIRECT_URL=$(echo "$DIRECT_URL" | sed 's/\/[^/]*$//')

          # Provision using the default admin database (DIRECT_URL)
          echo "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$DB_NAME' AND pid <> pg_backend_pid();" | psql $DIRECT_URL
          echo "DROP DATABASE IF EXISTS \"$DB_NAME\"" | psql $DIRECT_URL
          echo "CREATE DATABASE \"$DB_NAME\"" | psql $DIRECT_URL

          # Assign the cleanly formatted URLs for Prisma
          export DATABASE_URL="$BASE_DATABASE_URL/$DB_NAME"
          export DIRECT_URL="$BASE_DIRECT_URL/$DB_NAME"

          npx prisma migrate reset
          npx prisma generate
          npx prisma db seed

      - name: Deploy to Vercel Preview
        run: |
          export $(grep -v '^#' .vercel/.env.preview.local | xargs)
          
          # Strip the trailing "/postgres" for the deployment step too
          BASE_DATABASE_URL=$(echo "$DATABASE_URL" | sed 's/\/[^/]*$//')
          export NEW_DATABASE_URL="$BASE_DATABASE_URL/$DB_NAME"
          
          # Pass the clean URL to Vercel for both build-time and run-time
          npx vercel@latest deploy --token=$VERCEL_TOKEN --build-env DATABASE_URL=$NEW_DATABASE_URL --env DATABASE_URL=$NEW_DATABASE_URL