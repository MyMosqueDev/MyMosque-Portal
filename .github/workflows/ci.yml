name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Create DB & Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Branch Database Name
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr -cd '[:alnum:]_')
          echo "DB_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Pull Vercel Environment Variables
        run: npx vercel@latest pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Provision Branch Database & Run Migrations
        run: |
          # Load DATABASE_URL and DIRECT_URL from Vercel (base URLs, no /dbname yet)
          export $(grep -v '^#' .vercel/.env.preview.local | xargs)

          # Provision the branch database using the admin postgres DB
          echo "DROP DATABASE IF EXISTS \"$DB_NAME\"" | psql $DATABASE_URL/postgres
          echo "CREATE DATABASE \"$DB_NAME\"" | psql $DATABASE_URL/postgres

          # Point Prisma at the new branch database
          export DATABASE_URL=$DATABASE_URL/$DB_NAME
          export DIRECT_URL=$DIRECT_URL/$DB_NAME

          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Deploy to Vercel Preview
        run: |
          export $(grep -v '^#' .vercel/.env.preview.local | xargs)
          export DATABASE_URL=$DATABASE_URL/$DB_NAME
          npx vercel@latest deploy --token=$VERCEL_TOKEN --env DATABASE_URL=$DATABASE_URL
