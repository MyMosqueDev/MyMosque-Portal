name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Create DB & Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      # Base Supabase connection strings (store these in GitHub Secrets)
      # e.g., postgresql://postgres:YOUR_PASSWORD@db.YOUR_PROJECT.supabase.co:5432
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
      # Vercel CLI authentication (store in GitHub Secrets)
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Set up Branch Database Name
        # Replaces invalid characters (like /) with underscores for the DB name
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr -cd '[:alnum:]_')
          echo "DB_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Provision Branch Database
        # Uses the default postgres database to run the DROP/CREATE commands
        run: |
          eval $(python3 -c "
          from urllib.parse import urlparse
          import os
          u = urlparse(os.environ['DATABASE_URL'])
          print(f'export PGHOST={u.hostname}')
          print(f'export PGUSER={u.username}')
          print(f'export PGPASSWORD={u.password}')
          print(f'export PGPORT={u.port or 5432}')
          ")

          echo "Dropping existing database if it exists..."
          psql -h "$PGHOST" -U "$PGUSER" -d postgres -c "DROP DATABASE IF EXISTS \"$DB_NAME\";"

          echo "Creating new database for branch..."
          psql -h "$PGHOST" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$DB_NAME\";"

      - name: Run Prisma Migrations & Seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
        env:
          # Expose it specifically for this step
          DATABASE_URL: ${{ env.DATABASE_URL }}/${{ env.DB_NAME }}
          DIRECT_URL: ${{ env.DATABASE_URL }}/${{ env.DB_NAME }}

      - name: Deploy to Vercel Preview
        run: |
          # Pull Vercel environment variables
          vercel env pull .env.preview.local --environment=preview --token=$VERCEL_TOKEN
          
          # Build with Turbopack/Next.js using the branch-specific DB URL
          vercel build --token=$VERCEL_TOKEN
          
          # Deploy the prebuilt artifacts
          vercel deploy --prebuilt --token=$VERCEL_TOKEN
        env:
          # This ensures the Vercel build uses the newly created database
          DATABASE_URL: ${{ env.DATABASE_URL }}/${{ env.DB_NAME }}
          DIRECT_URL: ${{ env.DATABASE_URL }}/${{ env.DB_NAME }}