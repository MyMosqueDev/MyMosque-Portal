name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Create DB & Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Branch Database Name
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr -cd '[:alnum:]_')
          echo "DB_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Pull Vercel Environment Variables
        run: npx vercel@latest pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Provision Branch Database & Run Migrations
        run: |
          set -a; source .vercel/.env.preview.local; set +a

          # Build branch-specific URLs by replacing the database name (handles ?pgbouncer=true etc.)
          eval $(python3 -c "
          from urllib.parse import urlparse, urlunparse
          import os
          db = os.environ['DB_NAME']

          d = urlparse(os.environ['DIRECT_URL'])
          branch_direct = urlunparse((d.scheme, d.netloc, '/' + db, '', '', ''))
          admin_direct   = urlunparse((d.scheme, d.netloc, '/postgres', '', '', ''))

          p = urlparse(os.environ['DATABASE_URL'])
          branch_pooler = urlunparse((p.scheme, p.netloc, '/' + db, '', p.query, ''))

          print('ADMIN_URL=' + admin_direct)
          print('BRANCH_DIRECT_URL=' + branch_direct)
          print('BRANCH_POOLER_URL=' + branch_pooler)
          ")

          # Use direct connection (not pgbouncer) for DDL
          echo "DROP DATABASE IF EXISTS \"$DB_NAME\"" | psql "$ADMIN_URL"
          echo "CREATE DATABASE \"$DB_NAME\""         | psql "$ADMIN_URL"

          export DATABASE_URL=$BRANCH_POOLER_URL
          export DIRECT_URL=$BRANCH_DIRECT_URL

          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Deploy to Vercel Preview
        run: |
          set -a; source .vercel/.env.preview.local; set +a

          BRANCH_POOLER_URL=$(python3 -c "
          from urllib.parse import urlparse, urlunparse
          import os
          p = urlparse(os.environ['DATABASE_URL'])
          print(urlunparse((p.scheme, p.netloc, '/' + os.environ['DB_NAME'], '', p.query, '')))
          ")

          npx vercel@latest deploy --token=$VERCEL_TOKEN --env DATABASE_URL=$BRANCH_POOLER_URL
