name: Preview Deployment

on:
  push:
    branches-ignore:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Create DB & Deploy to Vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Branch Database Name
        run: |
          BRANCH_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | tr -cd '[:alnum:]_')
          echo "DB_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Pull Vercel Environment Variables
        run: npx vercel@latest pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Provision Branch Database & Run Migrations
        run: |
          # Load DATABASE_URL and DIRECT_URL from Vercel
          set -a; source .vercel/.env.preview.local; set +a

          # Build branch-specific URLs by replacing the db name (not appending)
          # DIRECT_URL ends with /postgres, DATABASE_URL ends with /postgres?pgbouncer=true
          # We need to replace "postgres" with $DB_NAME in the path only
          BRANCH_DIRECT_URL=$(python3 -c "
          from urllib.parse import urlparse, urlunparse
          import os
          u = urlparse(os.environ['DIRECT_URL'])
          print(urlunparse((u.scheme, u.netloc, '/' + os.environ['DB_NAME'], '', '', '')))
          ")

          BRANCH_POOLER_URL=$(python3 -c "
          from urllib.parse import urlparse, urlunparse
          import os
          u = urlparse(os.environ['DATABASE_URL'])
          print(urlunparse((u.scheme, u.netloc, '/' + os.environ['DB_NAME'], '', u.query, '')))
          ")

          ADMIN_URL=$(python3 -c "
          from urllib.parse import urlparse, urlunparse
          import os
          u = urlparse(os.environ['DIRECT_URL'])
          print(urlunparse((u.scheme, u.netloc, '/postgres', '', '', '')))
          ")

          # Provision the branch database via direct connection (not pgbouncer)
          echo "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$DB_NAME' AND pid <> pg_backend_pid();" | psql "$ADMIN_URL"
          echo "DROP DATABASE IF EXISTS \"$DB_NAME\"" | psql "$ADMIN_URL"
          echo "CREATE DATABASE \"$DB_NAME\""         | psql "$ADMIN_URL"

          # Point Prisma at the branch database (DIRECT_URL = direct conn, no pgbouncer)
          export DIRECT_URL=$BRANCH_DIRECT_URL
          export DATABASE_URL=$BRANCH_POOLER_URL

          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Deploy to Vercel Preview
        run: |
          set -a; source .vercel/.env.preview.local; set +a

          BRANCH_POOLER_URL=$(python3 -c "
          from urllib.parse import urlparse, urlunparse
          import os
          u = urlparse(os.environ['DATABASE_URL'])
          print(urlunparse((u.scheme, u.netloc, '/' + os.environ['DB_NAME'], '', u.query, '')))
          ")

          npx vercel@latest deploy --token=$VERCEL_TOKEN \
            --build-env DATABASE_URL="$BRANCH_POOLER_URL" \
            --env DATABASE_URL="$BRANCH_POOLER_URL"